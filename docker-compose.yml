services:
  backend:
    build: ./backend
    ports:
      - "7860:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:7860
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
